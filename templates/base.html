<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tev Applicant Screening</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full text-slate-800 antialiased">
<header class="bg-indigo-700 text-white shadow">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
    <a href="{{ url_for('index') }}" class="text-xl font-semibold tracking-tight focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded">Applicant Screening</a>
    <a href="{{ url_for('create') }}" class="inline-flex items-center gap-1 rounded-lg bg-white px-4 py-2 text-sm font-semibold text-indigo-700 shadow-sm hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
      <span aria-hidden="true" class="text-lg leading-none">+</span> New applicant
    </a>
  </div>
</header>
<main class="mx-auto max-w-6xl px-4 py-6">
  <p class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-2 text-sm text-amber-900">
    Model and rule results are advisory. A person makes every final decision.
  </p>
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div role="alert" class="mb-4 rounded-lg border px-4 py-3 text-sm font-medium {{ 'border-emerald-200 bg-emerald-50 text-emerald-900' if category == 'ok' else 'border-red-200 bg-red-50 text-red-900' }}">
    {{ message }}
  </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
